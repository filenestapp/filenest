name: FileNest
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    macOS: "13.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    MARKETING_VERSION: "0.2.13"
    CURRENT_PROJECT_VERSION: "18"
    GENERATE_INFOPLIST_FILE: "YES"
    INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright (c) 2026 FileNest"
    INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: Apple Development
    DEVELOPMENT_TEAM: U433596CL8
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    DEAD_CODE_STRIPPING: YES
    FILENEST_UPDATE_FEED_URL: ""
    FILENEST_SPARKLE_PUBLIC_KEY: ""

targets:
  FileNest:
    type: application
    platform: macOS
    sources:
      - path: FileNest
        excludes:
          - Skills
      - path: FileNest/Skills
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.filenest
        PRODUCT_NAME: FileNest
        PRODUCT_MODULE_NAME: FileNest
        INFOPLIST_KEY_CFBundleDisplayName: FileNest
        INFOPLIST_KEY_LSUIElement: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: "YES"
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.local.filenest.dev
          PRODUCT_NAME: FileNest Dev
          INFOPLIST_KEY_CFBundleDisplayName: FileNest Dev
    dependencies:
      - package: GRDB
        product: GRDB
      - package: SQLiteVec
        product: SQLiteVec
      - package: ZIPFoundation
        product: ZIPFoundation
      - package: Sparkle
        product: Sparkle
      - package: MarkdownUI
        product: MarkdownUI
    scheme:
      testTargets:
        - FileNestTests
    postBuildScripts:
      - name: Bundle FileNest OMP Adapter
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          HOST_SOURCE="${SRCROOT}/AgentHost/dist/filenest-agent-host"
          VERSION_SOURCE="${SRCROOT}/AgentHost/dist/version.txt"
          BUILD_INPUTS=(
            "${SRCROOT}/AgentHost/src/main.ts"
            "${SRCROOT}/AgentHost/package.json"
            "${SRCROOT}/AgentHost/bun.lock"
          )
          NEEDS_BUILD=0
          if [[ ! -x "${HOST_SOURCE}" || ! -s "${VERSION_SOURCE}" ]]; then
            NEEDS_BUILD=1
          else
            for INPUT in "${BUILD_INPUTS[@]}"; do
              if [[ ! -f "${INPUT}" || "${INPUT}" -nt "${HOST_SOURCE}" ]]; then
                NEEDS_BUILD=1
                break
              fi
            done
          fi
          if [[ "${NEEDS_BUILD}" == "1" ]]; then
            PATH="/opt/homebrew/bin:/usr/local/bin:${PATH}" "${SRCROOT}/script/build_agent_host.sh"
          fi

          HOST_DESTINATION="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/AgentHost"
          /usr/bin/install -d -m 0755 "${HOST_DESTINATION}"
          /usr/bin/install -m 0755 "${HOST_SOURCE}" "${HOST_DESTINATION}/filenest-agent-host"
          /usr/bin/install -m 0644 "${VERSION_SOURCE}" "${HOST_DESTINATION}/version.txt"
      - name: Generate Build Information
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          INFO_DIR="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          INFO_FILE="${INFO_DIR}/FileNestBuildInfo.plist"
          mkdir -p "${INFO_DIR}"
          rm -f "${INFO_FILE}"
          /usr/bin/plutil -create xml1 "${INFO_FILE}"
          /usr/bin/plutil -replace BuildDate -string "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${INFO_FILE}"
          /usr/bin/plutil -replace MarketingVersion -string "${MARKETING_VERSION}" "${INFO_FILE}"
          /usr/bin/plutil -replace BuildNumber -string "${CURRENT_PROJECT_VERSION}" "${INFO_FILE}"

          APP_INFO_PLIST="${TARGET_BUILD_DIR}/${WRAPPER_NAME}/Contents/Info.plist"
          if [[ ! -f "${APP_INFO_PLIST}" && -f "${TARGET_BUILD_DIR}/${INFOPLIST_PATH}" ]]; then
            APP_INFO_PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          fi
          if [[ ! -f "${APP_INFO_PLIST}" ]]; then
            exit 0
          fi
          /usr/bin/plutil -replace SUEnableAutomaticChecks -bool YES "${APP_INFO_PLIST}" 2>/dev/null \
            || /usr/bin/plutil -insert SUEnableAutomaticChecks -bool YES "${APP_INFO_PLIST}"
          /usr/bin/plutil -replace SUAllowsAutomaticUpdates -bool YES "${APP_INFO_PLIST}" 2>/dev/null \
            || /usr/bin/plutil -insert SUAllowsAutomaticUpdates -bool YES "${APP_INFO_PLIST}"
          /usr/bin/plutil -replace SUAutomaticallyUpdate -bool YES "${APP_INFO_PLIST}" 2>/dev/null \
            || /usr/bin/plutil -insert SUAutomaticallyUpdate -bool YES "${APP_INFO_PLIST}"

          if [[ -n "${FILENEST_UPDATE_FEED_URL:-}" ]]; then
            /usr/bin/plutil -replace SUFeedURL -string "${FILENEST_UPDATE_FEED_URL}" "${APP_INFO_PLIST}" 2>/dev/null \
              || /usr/bin/plutil -insert SUFeedURL -string "${FILENEST_UPDATE_FEED_URL}" "${APP_INFO_PLIST}"
          else
            /usr/bin/plutil -remove SUFeedURL "${APP_INFO_PLIST}" 2>/dev/null || true
          fi

          if [[ -n "${FILENEST_SPARKLE_PUBLIC_KEY:-}" ]]; then
            /usr/bin/plutil -replace SUPublicEDKey -string "${FILENEST_SPARKLE_PUBLIC_KEY}" "${APP_INFO_PLIST}" 2>/dev/null \
              || /usr/bin/plutil -insert SUPublicEDKey -string "${FILENEST_SPARKLE_PUBLIC_KEY}" "${APP_INFO_PLIST}"
          else
            /usr/bin/plutil -remove SUPublicEDKey "${APP_INFO_PLIST}" 2>/dev/null || true
          fi

  FileNestSkillCLI:
    type: tool
    platform: macOS
    sources:
      - path: FileNestCLI/FileNestSkillCLI.swift
      - path: FileNest/Services/SkillToolRuntime.swift
    settings:
      base:
        CODE_SIGNING_ALLOWED: "NO"
        PRODUCT_NAME: filenest

  FileNestTests:
    type: bundle.unit-test
    platform: macOS
    settings:
      base:
        # Xcode's bundled XCTest runtime requires macOS 14; this does not change the app's macOS 13 deployment target.
        MACOSX_DEPLOYMENT_TARGET: "14.0"
      configs:
        Debug:
          TEST_HOST: "$(BUILT_PRODUCTS_DIR)/FileNest Dev.app/Contents/MacOS/FileNest Dev"
    sources:
      - path: FileNestTests
    dependencies:
      - target: FileNest
      - package: GRDB
        product: GRDB
      - package: ZIPFoundation
        product: ZIPFoundation

packages:
  SQLiteVec:
    path: Vendor/SQLiteVec
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "6.29.0"
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: "0.9.20"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.3"
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui.git
    from: "2.4.1"
