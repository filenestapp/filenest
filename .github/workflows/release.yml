name: Cross-Platform Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Semantic release tag, for example v0.2.5"
        required: true
        default: "v0.2.5"
        type: string
      publish_release:
        description: "Publish a GitHub Release after both builds pass"
        required: true
        default: false
        type: boolean
      prerelease:
        description: "Mark the GitHub Release as a prerelease"
        required: true
        default: true
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

jobs:
  macos:
    name: macOS package
    runs-on: macos-26
    outputs:
      distribution_ready: ${{ steps.signing.outputs.distribution_ready }}
    env:
      MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
      MACOS_NOTARY_PRIVATE_KEY_BASE64: ${{ secrets.MACOS_NOTARY_PRIVATE_KEY_BASE64 }}
      FILENEST_SPARKLE_PRIVATE_KEY: ${{ secrets.FILENEST_SPARKLE_PRIVATE_KEY }}
      FILENEST_UPDATE_FEED_URL: ${{ vars.FILENEST_UPDATE_FEED_URL }}
      FILENEST_SPARKLE_PUBLIC_KEY: ${{ vars.FILENEST_SPARKLE_PUBLIC_KEY }}
      FILENEST_DOWNLOAD_BASE_URL: ${{ vars.FILENEST_DOWNLOAD_BASE_URL }}

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

          version="${RELEASE_TAG#v}"
          project_version="$(
            xcodebuild -project FileNest.xcodeproj -scheme FileNest \
              -configuration Release -showBuildSettings \
              CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM="" |
              awk '/ MARKETING_VERSION = / { print $3; exit }'
          )"
          if [[ "$project_version" != "$version" ]]; then
            echo "Release tag $RELEASE_TAG does not match macOS version $project_version" >&2
            exit 1
          fi

      - name: Run macOS tests
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project FileNest.xcodeproj -scheme FileNest \
            -configuration Debug -destination 'platform=macOS' \
            -derivedDataPath .build/TestDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            test

      - name: Configure distribution signing
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          required_values=(
            "$MACOS_CERTIFICATE_P12_BASE64"
            "$MACOS_CERTIFICATE_PASSWORD"
            "$MACOS_TEAM_ID"
            "$MACOS_NOTARY_KEY_ID"
            "$MACOS_NOTARY_ISSUER_ID"
            "$MACOS_NOTARY_PRIVATE_KEY_BASE64"
            "$FILENEST_SPARKLE_PRIVATE_KEY"
            "$FILENEST_UPDATE_FEED_URL"
            "$FILENEST_SPARKLE_PUBLIC_KEY"
            "$FILENEST_DOWNLOAD_BASE_URL"
          )

          missing=0
          for value in "${required_values[@]}"; do
            if [[ -z "$value" ]]; then
              missing=1
            fi
          done

          if [[ "$missing" -eq 1 ]]; then
            echo "Distribution signing or automatic-update configuration is incomplete; building an unsigned validation artifact."
            echo "distribution_ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Fail fast if the private key used to sign the update archive does
          # not derive the public key embedded in FileNest. This prevents a
          # release from reaching users when Sparkle would reject the archive.
          sparkle_key_size="$(printf '%s' "$FILENEST_SPARKLE_PRIVATE_KEY" | base64 --decode | wc -c | tr -d ' ')"
          case "$sparkle_key_size" in
            32)
              derived_sparkle_public_key="$(
                SPARKLE_PRIVATE_KEY="$FILENEST_SPARKLE_PRIVATE_KEY" swift - <<'SWIFT'
          import CryptoKit
          import Foundation

          guard let encodedKey = ProcessInfo.processInfo.environment["SPARKLE_PRIVATE_KEY"],
                let privateKeyData = Data(base64Encoded: encodedKey),
                privateKeyData.count == 32 else {
              exit(1)
          }

          let privateKey = try Curve25519.Signing.PrivateKey(rawRepresentation: privateKeyData)
          print(privateKey.publicKey.rawRepresentation.base64EncodedString())
          SWIFT
              )"
              ;;
            96)
              derived_sparkle_public_key="$(
                printf '%s' "$FILENEST_SPARKLE_PRIVATE_KEY" |
                  base64 --decode |
                  tail -c 32 |
                  base64
              )"
              ;;
            *)
              echo "FILENEST_SPARKLE_PRIVATE_KEY must decode to 32 or 96 bytes." >&2
              exit 1
              ;;
          esac

          if [[ "$derived_sparkle_public_key" != "$FILENEST_SPARKLE_PUBLIC_KEY" ]]; then
            echo "Sparkle private key does not match FILENEST_SPARKLE_PUBLIC_KEY." >&2
            echo "Expected public key: $FILENEST_SPARKLE_PUBLIC_KEY" >&2
            echo "Derived public key:  $derived_sparkle_public_key" >&2
            exit 1
          fi

          certificate_path="$RUNNER_TEMP/filenest-developer-id.p12"
          notary_key_path="$RUNNER_TEMP/AuthKey_${MACOS_NOTARY_KEY_ID}.p8"
          keychain_path="$RUNNER_TEMP/filenest-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"

          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate_path"
          printf '%s' "$MACOS_NOTARY_PRIVATE_KEY_BASE64" | base64 --decode > "$notary_key_path"
          chmod 600 "$certificate_path" "$notary_key_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -s "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain_path"

          signing_identity="$(
            security find-identity -v -p codesigning "$keychain_path" |
              sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' |
              head -n 1
          )"
          if [[ -z "$signing_identity" ]]; then
            echo "Developer ID Application identity was not found in the imported certificate." >&2
            exit 1
          fi

          echo "identity=$signing_identity" >> "$GITHUB_OUTPUT"
          echo "keychain_path=$keychain_path" >> "$GITHUB_OUTPUT"
          echo "notary_key_path=$notary_key_path" >> "$GITHUB_OUTPUT"
          echo "distribution_ready=true" >> "$GITHUB_OUTPUT"

      - name: Build macOS app
        shell: bash
        env:
          SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
          DISTRIBUTION_READY: ${{ steps.signing.outputs.distribution_ready }}
        run: |
          set -euo pipefail
          build_args=(
            -project FileNest.xcodeproj
            -scheme FileNest
            -configuration Release
            -destination 'platform=macOS'
            -derivedDataPath .build/ReleaseDerivedData
          )

          if [[ "$DISTRIBUTION_READY" == "true" ]]; then
            xcodebuild "${build_args[@]}" \
              CODE_SIGNING_ALLOWED=YES \
              CODE_SIGNING_REQUIRED=YES \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
              DEVELOPMENT_TEAM="$MACOS_TEAM_ID" \
              FILENEST_UPDATE_FEED_URL="$FILENEST_UPDATE_FEED_URL" \
              FILENEST_SPARKLE_PUBLIC_KEY="$FILENEST_SPARKLE_PUBLIC_KEY" \
              CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
              OTHER_CODE_SIGN_FLAGS="--timestamp" \
              build

            app=".build/ReleaseDerivedData/Build/Products/Release/FileNest.app"
            sparkle="$app/Contents/Frameworks/Sparkle.framework"
            sparkle_version="$sparkle/Versions/B"
            agent_host="$app/Contents/Resources/AgentHost/filenest-agent-host"

            if [[ ! -x "$agent_host" ]]; then
              echo "Bundled FileNest Agent Host is missing: $agent_host" >&2
              exit 1
            fi

            # Xcode's Embed & Sign phase does not re-sign Sparkle's nested helpers.
            # Sign from the innermost services outward, following Sparkle's
            # distribution guidance, then re-sign the containing app.
            codesign --force --sign "$SIGNING_IDENTITY" \
              --options runtime --timestamp \
              "$agent_host"
            codesign --force --sign "$SIGNING_IDENTITY" \
              --options runtime --timestamp \
              "$sparkle_version/XPCServices/Installer.xpc"
            codesign --force --sign "$SIGNING_IDENTITY" \
              --options runtime --timestamp \
              --preserve-metadata=entitlements \
              "$sparkle_version/XPCServices/Downloader.xpc"
            codesign --force --sign "$SIGNING_IDENTITY" \
              --options runtime --timestamp \
              "$sparkle_version/Autoupdate"
            codesign --force --sign "$SIGNING_IDENTITY" \
              --options runtime --timestamp \
              "$sparkle_version/Updater.app"
            codesign --force --sign "$SIGNING_IDENTITY" \
              --options runtime --timestamp \
              "$sparkle"
            codesign --force --sign "$SIGNING_IDENTITY" \
              --options runtime --timestamp \
              --preserve-metadata=entitlements \
              "$app"

            signed_targets=(
              "$agent_host"
              "$sparkle_version/XPCServices/Installer.xpc"
              "$sparkle_version/XPCServices/Downloader.xpc"
              "$sparkle_version/Autoupdate"
              "$sparkle_version/Updater.app"
              "$sparkle"
              "$app"
            )
            for target in "${signed_targets[@]}"; do
              signature_details="$(codesign -dvv "$target" 2>&1)"
              if ! grep -Fq "Authority=Developer ID Application:" <<< "$signature_details"; then
                echo "Developer ID signature is missing from $target" >&2
                exit 1
              fi
              if ! grep -Fq "Timestamp=" <<< "$signature_details"; then
                echo "Secure timestamp is missing from $target" >&2
                exit 1
              fi
            done
          else
            xcodebuild "${build_args[@]}" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              DEVELOPMENT_TEAM="" \
              FILENEST_UPDATE_FEED_URL="$FILENEST_UPDATE_FEED_URL" \
              FILENEST_SPARKLE_PUBLIC_KEY="$FILENEST_SPARKLE_PUBLIC_KEY" \
              build
            codesign --force --deep --sign - --options runtime \
              .build/ReleaseDerivedData/Build/Products/Release/FileNest.app
          fi

      - name: Package and validate macOS artifacts
        shell: bash
        env:
          SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
          KEYCHAIN_PATH: ${{ steps.signing.outputs.keychain_path }}
          NOTARY_KEY_PATH: ${{ steps.signing.outputs.notary_key_path }}
          DISTRIBUTION_READY: ${{ steps.signing.outputs.distribution_ready }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          app=".build/ReleaseDerivedData/Build/Products/Release/FileNest.app"
          output="$RUNNER_TEMP/release-assets"
          staging="$RUNNER_TEMP/dmg-staging"

          mkdir -p "$output"
          rm -rf "$staging"
          mkdir -p "$staging"
          codesign --verify --deep --strict --verbose=2 "$app"

          if [[ "$DISTRIBUTION_READY" == "true" ]]; then
            notarize_and_require_acceptance() {
              local artifact="$1"
              local result_path="$RUNNER_TEMP/notary-$(basename "$artifact").json"
              local submission_id=""
              local status=""
              local submit_exit=0

              xcrun notarytool submit "$artifact" \
                --key "$NOTARY_KEY_PATH" \
                --key-id "$MACOS_NOTARY_KEY_ID" \
                --issuer "$MACOS_NOTARY_ISSUER_ID" \
                --wait \
                --output-format json > "$result_path" || submit_exit=$?

              cat "$result_path"
              submission_id="$(plutil -extract id raw "$result_path" 2>/dev/null || true)"
              status="$(plutil -extract status raw "$result_path" 2>/dev/null || true)"

              if [[ "$submit_exit" -ne 0 || "$status" != "Accepted" ]]; then
                if [[ -n "$submission_id" ]]; then
                  echo "Notarization was not accepted. Fetching Apple's diagnostic log." >&2
                  xcrun notarytool log "$submission_id" \
                    --key "$NOTARY_KEY_PATH" \
                    --key-id "$MACOS_NOTARY_KEY_ID" \
                    --issuer "$MACOS_NOTARY_ISSUER_ID" || true
                fi
                return 1
              fi
            }

            zip_path="$output/FileNest-${version}-macOS.zip"
            dmg_path="$output/FileNest-${version}-macOS.dmg"
            notary_submission="$RUNNER_TEMP/FileNest-${version}-notary-submission.zip"

            ditto -c -k --sequesterRsrc --keepParent "$app" "$notary_submission"
            notarize_and_require_acceptance "$notary_submission"
            xcrun stapler staple "$app"
            xcrun stapler validate "$app"

            # Recreate the distributable archive from the stapled app so the
            # offline Gatekeeper ticket is included in the signed update.
            ditto -c -k --sequesterRsrc --keepParent "$app" "$zip_path"
            sparkle_signer=".build/ReleaseDerivedData/SourcePackages/artifacts/sparkle/Sparkle/bin/sign_update"
            sparkle_key_generator=".build/ReleaseDerivedData/SourcePackages/artifacts/sparkle/Sparkle/bin/generate_keys"
            if [[ ! -x "$sparkle_signer" ]]; then
              echo "Sparkle sign_update tool was not found at $sparkle_signer" >&2
              exit 1
            fi
            if [[ ! -x "$sparkle_key_generator" ]]; then
              echo "Sparkle generate_keys tool was not found at $sparkle_key_generator" >&2
              exit 1
            fi

            # The updater can only validate archives signed by the private EdDSA
            # key corresponding to SUPublicEDKey in the installed app. Prove that
            # the GitHub secret and the published public key form one key pair
            # before producing a release. The ephemeral CI keychain is deleted
            # with the runner after this job completes.
            sparkle_private_key_file="$RUNNER_TEMP/filenest-sparkle-private-key"
            printf '%s\n' "$FILENEST_SPARKLE_PRIVATE_KEY" > "$sparkle_private_key_file"
            chmod 600 "$sparkle_private_key_file"
            security default-keychain -s "$KEYCHAIN_PATH"
            sparkle_verification_account="filenest-release-verification"
            security delete-generic-password \
              -s "https://sparkle-project.org" \
              -a "$sparkle_verification_account" \
              "$KEYCHAIN_PATH" >/dev/null 2>&1 || true
            "$sparkle_key_generator" \
              --account "$sparkle_verification_account" \
              -f "$sparkle_private_key_file" >/dev/null
            derived_sparkle_public_key="$(
              "$sparkle_key_generator" \
                --account "$sparkle_verification_account" \
                -p
            )"
            if [[ "$derived_sparkle_public_key" != "$FILENEST_SPARKLE_PUBLIC_KEY" ]]; then
              echo "Sparkle private key does not match FILENEST_SPARKLE_PUBLIC_KEY." >&2
              echo "Expected public key: $FILENEST_SPARKLE_PUBLIC_KEY" >&2
              echo "Derived public key:  $derived_sparkle_public_key" >&2
              exit 1
            fi

            sparkle_signature="$(
              "$sparkle_signer" --ed-key-file "$sparkle_private_key_file" -p "$zip_path"
            )"
            if [[ -z "$sparkle_signature" ]]; then
              echo "Sparkle update signature is empty." >&2
              exit 1
            fi
            "$sparkle_signer" \
              --ed-key-file "$sparkle_private_key_file" \
              --verify "$zip_path" "$sparkle_signature"

            ditto "$app" "$staging/FileNest.app"
            # A standard installer DMG must expose an Applications alias so Finder
            # offers the expected drag-to-install destination.
            ln -s /Applications "$staging/Applications"
            hdiutil create \
              -volname "FileNest" \
              -srcfolder "$staging" \
              -ov -format UDZO "$dmg_path"
            codesign --force --sign "$SIGNING_IDENTITY" --timestamp "$dmg_path"
            notarize_and_require_acceptance "$dmg_path"
            xcrun stapler staple "$dmg_path"
            xcrun stapler validate "$dmg_path"
            spctl -a -vv -t exec "$app"

            build_number="$(plutil -extract CFBundleVersion raw "$app/Contents/Info.plist")"
            file_size="$(stat -f '%z' "$zip_path")"
            sha256="$(shasum -a 256 "$zip_path" | awk '{print $1}')"
            archive_name="$(basename "$zip_path")"
            metadata_path="$output/FileNest-${version}-macOS-update.json"
            export version build_number file_size sha256 archive_name sparkle_signature metadata_path
          python3 <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          repository = os.environ["GITHUB_REPOSITORY"]
          release_tag = os.environ["RELEASE_TAG"]
          download_base = os.environ["FILENEST_DOWNLOAD_BASE_URL"].rstrip("/")
          payload = {
              "id": f"macos-universal-stable-{os.environ['version']}-{os.environ['build_number']}",
              "version": os.environ["version"],
              "build": int(os.environ["build_number"]),
              "platform": "macos",
              "architecture": "universal",
              "channel": "stable",
              "published_at": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "download_url": f"{download_base}/{os.environ['archive_name']}",
              "file_size": int(os.environ["file_size"]),
              "sha256": os.environ["sha256"],
              "sparkle_ed_signature": os.environ["sparkle_signature"],
              "minimum_os_version": "13.0",
              "release_notes_url": f"https://github.com/{repository}/releases/tag/{release_tag}",
              "release_notes": "See the release notes for details.",
              "critical": False,
          }
          Path(os.environ["metadata_path"]).write_text(
              json.dumps(payload, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          else
            zip_path="$output/FileNest-${version}-macOS-unsigned.zip"
            dmg_path="$output/FileNest-${version}-macOS-unsigned.dmg"
            ditto -c -k --sequesterRsrc --keepParent "$app" "$zip_path"
            ditto "$app" "$staging/FileNest.app"
            ln -s /Applications "$staging/Applications"
            hdiutil create \
              -volname "FileNest" \
              -srcfolder "$staging" \
              -ov -format UDZO "$dmg_path"
          fi

          (
            cd "$output"
            shasum -a 256 ./* > SHA256SUMS-macOS.txt
          )

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          retention-days: 14

  omp-agent-host:
    name: OMP Agent Host (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-15
            bun_target: bun-darwin-arm64
          - architecture: x86_64
            runner: macos-15-intel
            bun_target: bun-darwin-x64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Build and verify OMP Agent Host
        shell: bash
        env:
          FILENEST_AGENT_HOST_TARGET: ${{ matrix.bun_target }}
          FILENEST_AGENT_HOST_OUTPUT: ${{ runner.temp }}/omp-agent-host/filenest-agent-host-${{ matrix.architecture }}
        run: |
          set -euo pipefail
          ./script/build_agent_host.sh
          output="${FILENEST_AGENT_HOST_OUTPUT}"
          test -x "${output}"
          test -s "${output}.sha256"
          test -s "$(dirname "${output}")/version.txt"
          shasum -a 256 --check "${output}.sha256"
          mv "$(dirname "${output}")/version.txt" "${output}.version.txt"

      - name: Upload OMP Agent Host artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-omp-agent-host-${{ matrix.architecture }}
          path: ${{ runner.temp }}/omp-agent-host/*
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows package
    runs-on: windows-latest
    defaults:
      run:
        working-directory: FileNestWindows
    env:
      WINDOWS_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      WINDOWS_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: FileNestWindows/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate release version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:RELEASE_TAG -ne "v$version") {
            throw "Release tag $env:RELEASE_TAG does not match Windows version $version"
          }

      - name: Verify source
        run: |
          npm run typecheck
          npm test

      - name: Build Windows packages
        run: npm run package:win

      - name: Validate Universal installer installation
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $installer = Resolve-Path "release/FileNest-Setup-$version.exe"
          $process = Start-Process -FilePath $installer -ArgumentList @('/S', '/currentuser') -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Universal installer failed with exit code $($process.ExitCode)"
          }

          $mainExecutable = Join-Path $env:LOCALAPPDATA "Programs\FileNest\FileNest.exe"
          if (-not (Test-Path $mainExecutable -PathType Leaf)) {
            throw "Installed main executable is missing: $mainExecutable"
          }

          & $mainExecutable --version
          if ($LASTEXITCODE -ne 0) {
            throw "Installed main executable failed its smoke test with exit code $LASTEXITCODE"
          }

      - name: Verify release layout and checksums
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $expected = @(
            "release/FileNest-Setup-$version.exe",
            "release/FileNest-Setup-$version.exe.blockmap",
            "release/FileNest-Portable-$version-x64.exe",
            "release/FileNest-Portable-$version-arm64.exe",
            "release/latest.yml"
          )
          foreach ($path in $expected) {
            if (-not (Test-Path $path)) {
              throw "Missing release artifact: $path"
            }
          }

          $unexpected = Get-ChildItem "release/FileNest-Setup-$version-*.exe" -ErrorAction SilentlyContinue
          if ($unexpected) {
            throw "Architecture-specific Setup files were generated unexpectedly: $($unexpected.Name -join ', ')"
          }

          $checksumFiles = @(
            "release/FileNest-Setup-$version.exe",
            "release/FileNest-Portable-$version-x64.exe",
            "release/FileNest-Portable-$version-arm64.exe"
          )
          $checksums = foreach ($path in $checksumFiles) {
            $hash = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([System.IO.Path]::GetFileName($path))"
          }
          $checksumText = ($checksums -join "`n") + "`n"
          $checksumPath = Join-Path (Get-Location) "release/SHA256SUMS-Windows.txt"
          [System.IO.File]::WriteAllText(
            $checksumPath,
            $checksumText,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: |
            FileNestWindows/release/FileNest-Setup-*.exe
            FileNestWindows/release/FileNest-Setup-*.exe.blockmap
            FileNestWindows/release/FileNest-Portable-*.exe
            FileNestWindows/release/latest.yml
            FileNestWindows/release/SHA256SUMS-Windows.txt
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs:
      - macos
      - omp-agent-host
      - windows
    if: >-
      ${{
        always() &&
        needs.macos.result == 'success' &&
        needs['omp-agent-host'].result == 'success' &&
        needs.windows.result == 'success' &&
        (github.event_name == 'push' || inputs.publish_release)
      }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      DISTRIBUTION_READY: ${{ needs.macos.outputs.distribution_ready }}
      FILENEST_DEPLOY_HOST: ${{ vars.FILENEST_DEPLOY_HOST }}
      FILENEST_DEPLOY_USER: ${{ vars.FILENEST_DEPLOY_USER }}
      FILENEST_DEPLOY_SSH_KEY: ${{ secrets.FILENEST_DEPLOY_SSH_KEY }}
      FILENEST_UPDATE_ADMIN_URL: ${{ vars.FILENEST_UPDATE_ADMIN_URL }}
      FILENEST_UPDATE_ADMIN_TOKEN: ${{ secrets.FILENEST_UPDATE_ADMIN_TOKEN }}
      FILENEST_DOWNLOAD_BASE_URL: ${{ vars.FILENEST_DOWNLOAD_BASE_URL }}
      FILENEST_UPDATE_DATA_DIR: ${{ vars.FILENEST_UPDATE_DATA_DIR }}
      FILENEST_OMP_MANIFEST_FILE: ${{ vars.FILENEST_OMP_MANIFEST_FILE }}

    steps:
      - name: Require signed and notarized macOS output
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DISTRIBUTION_READY" != "true" ]]; then
            echo "Publishing requires all macOS signing and notarization secrets." >&2
            exit 1
          fi

      - name: Download release artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Publish release with GitHub CLI
        shell: bash
        run: |
          set -euo pipefail
          release_args=(
            "$RELEASE_TAG"
            release-assets/*
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "FileNest ${RELEASE_TAG#v}"
            --generate-notes
          )

          if [[ "${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}" == "true" ]]; then
            release_args+=(--prerelease)
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "${release_args[@]}"
          fi

      - name: Publish signed macOS update
        shell: bash
        run: |
          set -euo pipefail
          required_values=(
            "$FILENEST_DEPLOY_HOST"
            "$FILENEST_DEPLOY_USER"
            "$FILENEST_DEPLOY_SSH_KEY"
            "$FILENEST_UPDATE_ADMIN_URL"
            "$FILENEST_UPDATE_ADMIN_TOKEN"
          )
          for value in "${required_values[@]}"; do
            if [[ -z "$value" ]]; then
              echo "Production update deployment configuration is incomplete." >&2
              exit 1
            fi
          done

          version="${RELEASE_TAG#v}"
          archive="release-assets/FileNest-${version}-macOS.zip"
          metadata="release-assets/FileNest-${version}-macOS-update.json"
          if [[ ! -f "$archive" || ! -f "$metadata" ]]; then
            echo "Signed update archive or metadata is missing." >&2
            exit 1
          fi

          ssh_key="$RUNNER_TEMP/filenest-deploy-key"
          known_hosts="$RUNNER_TEMP/known_hosts"
          printf '%s\n' "$FILENEST_DEPLOY_SSH_KEY" > "$ssh_key"
          chmod 600 "$ssh_key"
          ssh-keyscan -H "$FILENEST_DEPLOY_HOST" > "$known_hosts"

          remote_staging="/home/${FILENEST_DEPLOY_USER}/.$(basename "$archive").upload"
          scp -i "$ssh_key" -o UserKnownHostsFile="$known_hosts" \
            "$archive" \
            "${FILENEST_DEPLOY_USER}@${FILENEST_DEPLOY_HOST}:${remote_staging}"
          ssh -i "$ssh_key" -o UserKnownHostsFile="$known_hosts" \
            "${FILENEST_DEPLOY_USER}@${FILENEST_DEPLOY_HOST}" \
            "sudo install -m 0644 -o ${FILENEST_DEPLOY_USER} -g www '$remote_staging' '/var/lib/filenest-update-api/downloads/$(basename "$archive")' && unlink '$remote_staging'"

          download_url="$(
            python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["download_url"])' "$metadata"
          )"
          # Use a unique query string and retries so a stale CDN 404 cannot
          # fail the release immediately after the origin archive is replaced.
          validation_url="${download_url}?release_validation=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          curl --fail-with-body --silent --show-error --location --head \
            --retry 12 \
            --retry-delay 5 \
            --retry-all-errors \
            "$validation_url" >/dev/null
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $FILENEST_UPDATE_ADMIN_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary "@$metadata" \
            "$FILENEST_UPDATE_ADMIN_URL/v1/admin/releases" >/dev/null

          rm -f "$ssh_key" "$known_hosts"
          echo "Published signed macOS update metadata and archive."

      - name: Deploy update API before publishing OMP manifest
        shell: bash
        env:
          FILENEST_DEPLOY_HOST: ${{ vars.FILENEST_DEPLOY_HOST }}
          FILENEST_DEPLOY_USER: ${{ vars.FILENEST_DEPLOY_USER }}
          FILENEST_DEPLOY_SSH_KEY: ${{ secrets.FILENEST_DEPLOY_SSH_KEY }}
          FILENEST_UPDATE_DATA_DIR: ${{ vars.FILENEST_UPDATE_DATA_DIR }}
          FILENEST_OMP_MANIFEST_FILE: ${{ vars.FILENEST_OMP_MANIFEST_FILE }}
        run: |
          set -euo pipefail
          required_values=("$FILENEST_DEPLOY_HOST" "$FILENEST_DEPLOY_USER" "$FILENEST_DEPLOY_SSH_KEY")
          for value in "${required_values[@]}"; do
            if [[ -z "$value" ]]; then
              echo "Update API deployment configuration is incomplete." >&2
              exit 1
            fi
          done

          ssh_key="$RUNNER_TEMP/filenest-update-api-key"
          printf '%s\n' "$FILENEST_DEPLOY_SSH_KEY" > "$ssh_key"
          chmod 600 "$ssh_key"
          trap 'rm -f "$ssh_key"' EXIT

          FILENEST_DEPLOY_KEY="$ssh_key" \
            FILENEST_DEPLOY_HOST="$FILENEST_DEPLOY_HOST" \
            FILENEST_DEPLOY_USER="$FILENEST_DEPLOY_USER" \
            FILENEST_UPDATE_DATA_DIR="$FILENEST_UPDATE_DATA_DIR" \
            FILENEST_OMP_MANIFEST_FILE="$FILENEST_OMP_MANIFEST_FILE" \
            ./scripts/deploy-non-docker.sh --skip-website --skip-r2

      - name: Publish OMP Agent Host artifacts and manifest
        shell: bash
        run: |
          set -euo pipefail
          required_values=(
            "$FILENEST_DEPLOY_HOST"
            "$FILENEST_DEPLOY_USER"
            "$FILENEST_DEPLOY_SSH_KEY"
            "$FILENEST_UPDATE_ADMIN_URL"
            "$FILENEST_DOWNLOAD_BASE_URL"
          )
          for value in "${required_values[@]}"; do
            if [[ -z "$value" ]]; then
              echo "OMP Agent Host deployment configuration is incomplete." >&2
              exit 1
            fi
          done

          arm_binary="release-assets/filenest-agent-host-arm64"
          x86_binary="release-assets/filenest-agent-host-x86_64"
          arm_version_file="${arm_binary}.version.txt"
          x86_version_file="${x86_binary}.version.txt"
          for file in "$arm_binary" "$x86_binary" "$arm_version_file" "$x86_version_file"; do
            [[ -s "$file" ]] || {
              echo "Missing OMP Agent Host artifact: $file" >&2
              exit 1
            }
          done

          omp_version="$(tr -d '[:space:]' < "$arm_version_file")"
          x86_version="$(tr -d '[:space:]' < "$x86_version_file")"
          [[ -n "$omp_version" && "$omp_version" == "$x86_version" ]] || {
            echo "OMP Agent Host versions do not match: $omp_version vs $x86_version" >&2
            exit 1
          }
          [[ "$omp_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "Invalid OMP Agent Host version: $omp_version" >&2
            exit 1
          }

          arm_sha="$(shasum -a 256 "$arm_binary" | awk '{print $1}')"
          x86_sha="$(shasum -a 256 "$x86_binary" | awk '{print $1}')"
          manifest="$RUNNER_TEMP/omp-agent-manifest.json"
          OMP_VERSION="$omp_version" \
          ARM_SHA="$arm_sha" \
          X86_SHA="$x86_sha" \
          DOWNLOAD_BASE="${FILENEST_DOWNLOAD_BASE_URL%/}" \
          python3 - "$manifest" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          version = os.environ["OMP_VERSION"]
          base = os.environ["DOWNLOAD_BASE"]
          payload = {
              "version": version,
              "artifacts": {
                  "arm64": {
                      "url": f"{base}/omp-agent/{version}/filenest-agent-host-arm64",
                      "sha256": os.environ["ARM_SHA"],
                  },
                  "x86_64": {
                      "url": f"{base}/omp-agent/{version}/filenest-agent-host-x86_64",
                      "sha256": os.environ["X86_SHA"],
                  },
              },
          }
          Path(sys.argv[1]).write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY

          remote_data_dir="${FILENEST_UPDATE_DATA_DIR:-/var/lib/filenest-update-api}"
          remote_manifest="${FILENEST_OMP_MANIFEST_FILE:-$remote_data_dir/omp-agent-manifest.json}"
          if [[ ! "$remote_data_dir" =~ ^/[A-Za-z0-9._/-]+$ ||
                ! "$remote_manifest" =~ ^/[A-Za-z0-9._/-]+$ ]]; then
            echo "Remote OMP paths must be safe absolute paths." >&2
            exit 1
          fi

          ssh_key="$RUNNER_TEMP/filenest-omp-deploy-key"
          known_hosts="$RUNNER_TEMP/omp-known_hosts"
          printf '%s\n' "$FILENEST_DEPLOY_SSH_KEY" > "$ssh_key"
          chmod 600 "$ssh_key"
          ssh-keyscan -H "$FILENEST_DEPLOY_HOST" > "$known_hosts"
          ssh_options=(-i "$ssh_key" -o UserKnownHostsFile="$known_hosts")

          for architecture in arm64 x86_64; do
            binary="release-assets/filenest-agent-host-$architecture"
            remote_relative="omp-agent/$omp_version/filenest-agent-host-$architecture"
            remote_download_path="$remote_data_dir/downloads/$remote_relative"
            remote_download_dir="$(dirname "$remote_download_path")"
            remote_staging="/tmp/filenest-$architecture-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.upload"
            scp "${ssh_options[@]}" "$binary" "${FILENEST_DEPLOY_USER}@${FILENEST_DEPLOY_HOST}:$remote_staging"
            ssh "${ssh_options[@]}" "${FILENEST_DEPLOY_USER}@${FILENEST_DEPLOY_HOST}" \
              "sudo install -d -m 0755 -o ${FILENEST_DEPLOY_USER} -g www '$remote_download_dir' && sudo install -m 0755 -o ${FILENEST_DEPLOY_USER} -g www '$remote_staging' '$remote_download_path' && rm -f '$remote_staging'"
          done

          manifest_staging="/tmp/filenest-omp-manifest-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.upload"
          remote_manifest_dir="$(dirname "$remote_manifest")"
          scp "${ssh_options[@]}" "$manifest" "${FILENEST_DEPLOY_USER}@${FILENEST_DEPLOY_HOST}:$manifest_staging"
          ssh "${ssh_options[@]}" "${FILENEST_DEPLOY_USER}@${FILENEST_DEPLOY_HOST}" \
            "sudo install -d -m 0750 -o ${FILENEST_DEPLOY_USER} -g www '$remote_manifest_dir' && sudo install -m 0640 -o ${FILENEST_DEPLOY_USER} -g www '$manifest_staging' '$remote_manifest' && rm -f '$manifest_staging'"

          manifest_url="${FILENEST_UPDATE_ADMIN_URL%/}/omp-agent/stable.json?release_validation=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          curl --fail-with-body --silent --show-error --location --retry 12 --retry-delay 5 --retry-all-errors "$manifest_url" > "$RUNNER_TEMP/published-omp-manifest.json"
          OMP_VERSION="$omp_version" python3 - "$RUNNER_TEMP/published-omp-manifest.json" <<'PY'
          import json
          import os
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              manifest = json.load(handle)
          if manifest.get("version") != os.environ["OMP_VERSION"]:
              raise SystemExit("published OMP manifest version mismatch")
          if set(manifest.get("artifacts", {})) != {"arm64", "x86_64"}:
              raise SystemExit("published OMP manifest architecture mismatch")
          PY

          rm -f "$ssh_key" "$known_hosts"
          echo "Published OMP Agent Host version $omp_version and verified its public manifest."
