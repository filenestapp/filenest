name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS tests
    runs-on: macos-26
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Run tests
        run: |
          xcodebuild -project FileNest.xcodeproj -scheme FileNest \
            -configuration Debug -destination 'platform=macOS' \
            -derivedDataPath .build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            test

  windows-source:
    name: Windows source checks
    runs-on: windows-latest
    defaults:
      run:
        working-directory: FileNestWindows
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: FileNestWindows/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
