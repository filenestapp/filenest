name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS tests
    runs-on: macos-26
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Run tests
        run: |
          xcodebuild -project FileNest.xcodeproj -scheme FileNest \
            -configuration Debug -destination 'platform=macOS' \
            -derivedDataPath .build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            test

  windows-source:
    name: Windows source checks
    runs-on: windows-latest
    defaults:
      run:
        working-directory: FileNestWindows
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: FileNestWindows/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  update-server:
    name: Update server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: update-server
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: update-server/go.mod
          cache: true
          cache-dependency-path: update-server/go.mod

      - name: Run Go tests
        run: go test ./...

  omp-agent-host-source:
    name: OMP Agent Host source checks
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Run TypeScript checks
        working-directory: AgentHost
        run: |
          bun install --frozen-lockfile
          bun run check
