name: Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: FileNestWindows
    env:
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: FileNestWindows/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify source
        run: |
          npm run typecheck
          npm test

      - name: Build Windows packages
        run: npm run package:win

      - name: Verify release layout and checksums
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $version"
          }

          $expected = @(
            "release/FileNest-Setup-$version.exe",
            "release/FileNest-Setup-$version.exe.blockmap",
            "release/FileNest-Portable-$version-x64.exe",
            "release/FileNest-Portable-$version-arm64.exe",
            "release/latest.yml"
          )
          foreach ($path in $expected) {
            if (-not (Test-Path $path)) { throw "Missing release artifact: $path" }
          }

          $unexpected = Get-ChildItem "release/FileNest-Setup-$version-*.exe" -ErrorAction SilentlyContinue
          if ($unexpected) {
            throw "Architecture-specific Setup files were generated unexpectedly: $($unexpected.Name -join ', ')"
          }

          $checksumFiles = @(
            "release/FileNest-Setup-$version.exe",
            "release/FileNest-Portable-$version-x64.exe",
            "release/FileNest-Portable-$version-arm64.exe"
          )
          $checksums = foreach ($path in $checksumFiles) {
            $hash = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([System.IO.Path]::GetFileName($path))"
          }
          Set-Content -Path "release/SHA256SUMS.txt" -Value $checksums -Encoding ascii

      - name: Publish GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $assets = @(
            "release/FileNest-Setup-$version.exe",
            "release/FileNest-Setup-$version.exe.blockmap",
            "release/FileNest-Portable-$version-x64.exe",
            "release/FileNest-Portable-$version-arm64.exe",
            "release/latest.yml",
            "release/SHA256SUMS.txt"
          )
          gh release create $env:GITHUB_REF_NAME @assets `
            --repo $env:GITHUB_REPOSITORY `
            --title "FileNest $version for Windows" `
            --generate-notes `
            --prerelease
