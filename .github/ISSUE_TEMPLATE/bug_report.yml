name: Bug report
description: Report a reproducible FileNest problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve FileNest. Remove credentials, personal files, and private document content before submitting.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Windows
        - Website
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: FileNest version or commit
      placeholder: "0.2.5 or commit SHA"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open...
        2. Configure...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste only sanitized logs. Never include API keys or private file contents.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched for an existing issue.
          required: true
        - label: I removed credentials and private data.
          required: true
        - label: This is not a security vulnerability.
          required: true
