<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1020" />
    <title>FileNest — Main Site Directions</title>
    <style>
      :root {
        --canvas: #e9e9e6;
        --ink: #111319;
        --muted: #666970;
        --line: #d6d7d3;
        --violet: #5f58f7;
        --paper: #fbfbf9;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Noto Sans SC", sans-serif;
      }
      * { box-sizing: border-box; }
      body { min-width: 320px; margin: 0; background: var(--canvas); color: var(--ink); }
      button { font: inherit; }
      .studio-bar { position: sticky; z-index: 10; top: 0; display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 16px clamp(18px, 4vw, 56px); border-bottom: 1px solid rgb(17 19 25 / 10%); background: rgb(233 233 230 / 86%); backdrop-filter: blur(18px); }
      .studio-title { display: grid; gap: 2px; }
      .studio-title strong { font-size: 15px; letter-spacing: -0.02em; }
      .studio-title span { color: var(--muted); font-size: 12px; }
      .direction-switcher { display: flex; gap: 6px; overflow-x: auto; }
      .direction-switcher button { min-height: 38px; flex: none; padding: 0 13px; border: 1px solid transparent; border-radius: 999px; background: transparent; color: #4d5057; cursor: pointer; font-size: 13px; font-weight: 650; transition: 180ms ease; }
      .direction-switcher button:hover, .direction-switcher button[aria-pressed="true"] { border-color: #c6c8ce; background: #fff; color: #14151b; box-shadow: 0 4px 12px rgb(19 20 25 / 8%); }
      .design-brief { width: min(1240px, calc(100% - 36px)); margin: 48px auto 26px; display: grid; grid-template-columns: 0.9fr 1.1fr; gap: 44px; }
      .eyebrow { margin: 0 0 12px; color: #6062a5; font-size: 12px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; }
      .design-brief h1 { max-width: 640px; margin: 0; font-size: clamp(2.25rem, 5vw, 4.85rem); letter-spacing: -0.065em; line-height: 0.96; }
      .design-brief__copy { align-self: end; color: #51545c; font-size: 16px; line-height: 1.65; }
      .design-brief__copy p { margin: 0; }
      .design-brief__copy strong { color: #1d1e25; }
      .design-stage { width: min(1460px, calc(100% - 28px)); min-height: 780px; margin: 0 auto 30px; overflow: hidden; border: 1px solid #cfd0cc; border-radius: 24px; background: #fff; box-shadow: 0 24px 70px rgb(23 24 28 / 12%); }
      .concept { display: none; min-height: 780px; }
      .concept.is-active { display: block; animation: appear 360ms ease both; }
      .concept-shell { min-height: 780px; }
      .concept-nav { height: 74px; display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 0 clamp(24px, 4vw, 60px); }
      .concept-brand { display: inline-flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 750; letter-spacing: -0.03em; }
      .concept-brand img { width: 32px; height: 32px; border-radius: 9px; }
      .concept-links { display: flex; align-items: center; gap: clamp(14px, 2.8vw, 34px); color: currentColor; font-size: 13px; font-weight: 650; }
      .concept-links span { opacity: 0.7; }
      .concept-cta { min-height: 38px; padding: 0 14px; border: 0; border-radius: 9px; background: currentColor; color: #fff; cursor: pointer; font-size: 12px; font-weight: 750; }
      .preview-footer { width: min(1240px, calc(100% - 44px)); margin: 0 auto 60px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
      .preview-card { display: grid; gap: 10px; min-height: 150px; padding: 19px; border: 1px solid #d2d3d0; border-radius: 16px; background: #f7f7f5; text-align: left; cursor: pointer; transition: 180ms ease; }
      .preview-card:hover, .preview-card.is-active { border-color: #8d89f7; background: #fff; box-shadow: 0 12px 24px rgb(41 37 125 / 9%); transform: translateY(-2px); }
      .preview-card__number { color: #767986; font-size: 11px; font-weight: 800; letter-spacing: 0.12em; }
      .preview-card strong { font-size: 17px; letter-spacing: -0.025em; }
      .preview-card span:last-child { color: #676a73; font-size: 13px; line-height: 1.45; }

      /* Direction 01 — editorial minimal */
      .minimal { background: #f8f7f3; color: #171717; }
      .minimal .concept-nav { border-bottom: 1px solid #deddd8; }
      .minimal .concept-cta { background: #171717; color: #fff; }
      .minimal__hero { min-height: 566px; display: grid; grid-template-columns: 0.9fr 1.1fr; align-items: center; gap: clamp(38px, 7vw, 108px); padding: 62px clamp(24px, 6vw, 92px) 76px; }
      .minimal__copy { max-width: 600px; }
      .minimal__copy h2 { margin: 0; font-family: "Iowan Old Style", "Baskerville", "Songti SC", serif; font-size: clamp(3.5rem, 6.8vw, 6.8rem); font-weight: 400; letter-spacing: -0.075em; line-height: 0.88; }
      .minimal__copy h2 em { font-style: italic; }
      .minimal__copy p { max-width: 42ch; margin: 30px 0; color: #5e5c57; font-size: 17px; line-height: 1.65; }
      .minimal__action-row { display: flex; align-items: center; gap: 20px; }
      .minimal__action-row button { min-height: 46px; padding: 0 17px; border: 0; border-radius: 6px; background: #171717; color: #fff; cursor: pointer; font-size: 13px; font-weight: 750; }
      .minimal__action-row span { font-size: 13px; font-weight: 700; text-decoration: underline; text-underline-offset: 4px; }
      .minimal__visual { position: relative; }
      .minimal__visual::before { position: absolute; z-index: 0; inset: -28px -34px 26px 42px; background: #ebeae3; content: ""; }
      .minimal__visual img { position: relative; z-index: 1; width: 100%; border: 1px solid #d5d3cd; box-shadow: 18px 20px 0 #d9d7d0; }
      .minimal__caption { position: relative; z-index: 1; display: flex; justify-content: space-between; margin-top: 14px; color: #6a6964; font-size: 11px; font-weight: 750; letter-spacing: 0.06em; text-transform: uppercase; }
      .minimal__proof { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid #deddd8; }
      .minimal__proof div { min-height: 142px; padding: 25px clamp(24px, 6vw, 90px); border-right: 1px solid #deddd8; }
      .minimal__proof div:last-child { border-right: 0; }
      .minimal__proof b { display: block; font-family: "Iowan Old Style", "Baskerville", serif; font-size: 30px; font-weight: 400; letter-spacing: -0.04em; }
      .minimal__proof span { display: block; margin-top: 6px; color: #686660; font-size: 13px; }

      /* Direction 02 — future AI */
      .future { position: relative; overflow: hidden; background: #090a13; color: #f6f7ff; }
      .future::before { position: absolute; inset: -38% -20% auto; height: 700px; background: radial-gradient(circle, rgb(107 76 255 / 33%), transparent 58%); content: ""; pointer-events: none; }
      .future .concept-nav { position: relative; border-bottom: 1px solid rgb(255 255 255 / 10%); }
      .future .concept-links span { opacity: 0.64; }
      .future .concept-cta { background: #f5f5ff; color: #11121d; }
      .future__hero { position: relative; min-height: 706px; display: grid; grid-template-columns: 0.94fr 1.06fr; align-items: center; gap: 42px; padding: 76px clamp(24px, 6vw, 92px); }
      .future__copy { position: relative; z-index: 2; max-width: 590px; }
      .future__signal { display: inline-flex; align-items: center; gap: 9px; color: #bab7ff; font-size: 12px; font-weight: 760; letter-spacing: 0.08em; text-transform: uppercase; }
      .future__signal i { width: 8px; height: 8px; border-radius: 50%; background: #8d86ff; box-shadow: 0 0 0 5px rgb(141 134 255 / 15%), 0 0 24px #8d86ff; }
      .future__copy h2 { margin: 22px 0 0; font-size: clamp(3.65rem, 7vw, 7.2rem); letter-spacing: -0.08em; line-height: 0.87; }
      .future__copy h2 span { display: block; color: #9a95ff; }
      .future__copy p { max-width: 45ch; margin: 28px 0; color: #c8c8dc; font-size: 17px; line-height: 1.65; }
      .future__buttons { display: flex; gap: 12px; }
      .future__buttons button { min-height: 46px; padding: 0 16px; border: 1px solid rgb(255 255 255 / 16%); border-radius: 8px; background: transparent; color: #f6f7ff; cursor: pointer; font-size: 13px; font-weight: 750; }
      .future__buttons button:first-child { border-color: #8d86ff; background: #7169ef; }
      .future__visual { position: relative; z-index: 1; }
      .future__orb { position: absolute; top: 48%; left: 50%; width: min(53vw, 610px); aspect-ratio: 1; border: 1px solid rgb(149 139 255 / 42%); border-radius: 50%; box-shadow: inset 0 0 82px rgb(122 108 255 / 11%), 0 0 90px rgb(96 73 255 / 17%); transform: translate(-50%, -50%); }
      .future__orb::before, .future__orb::after { position: absolute; inset: 14%; border: 1px solid rgb(149 139 255 / 30%); border-radius: 50%; content: ""; }
      .future__orb::after { inset: 30%; }
      .future__window { position: relative; margin: 0 auto; overflow: hidden; border: 1px solid rgb(192 190 255 / 46%); border-radius: 15px; box-shadow: 0 30px 90px rgb(0 0 0 / 48%); transform: rotateY(-5deg) rotateX(3deg); }
      .future__window img { width: 100%; filter: saturate(0.92) contrast(1.04); }
      .future__window::after { position: absolute; inset: 0; background: linear-gradient(125deg, rgb(126 115 255 / 18%), transparent 32%); content: ""; pointer-events: none; }
      .future__nodes { position: absolute; z-index: 2; inset: 0; pointer-events: none; }
      .future__nodes i { position: absolute; width: 9px; height: 9px; border-radius: 50%; background: #a19cff; box-shadow: 0 0 16px #8d86ff; }
      .future__nodes i:nth-child(1) { top: 13%; right: 4%; } .future__nodes i:nth-child(2) { top: 70%; right: 0; } .future__nodes i:nth-child(3) { top: 82%; left: 5%; }
      .future__lower { display: grid; grid-template-columns: 0.9fr 1.1fr; gap: 48px; padding: 24px clamp(24px, 6vw, 92px) 42px; border-top: 1px solid rgb(255 255 255 / 10%); }
      .future__lower strong { font-size: 14px; }
      .future__lower p { margin: 6px 0 0; color: #a8a7ba; font-size: 13px; }
      .future__chips { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
      .future__chips span { padding: 6px 9px; border: 1px solid rgb(255 255 255 / 14%); border-radius: 999px; color: #cccaf4; font-size: 11px; }

      /* Direction 03 — macOS native */
      .native { background: linear-gradient(145deg, #f4f5f7, #e9ebef); color: #1b1d22; }
      .native .concept-nav { border-bottom: 1px solid rgb(39 42 50 / 12%); background: rgb(255 255 255 / 48%); backdrop-filter: blur(18px); }
      .native .concept-cta { background: #0d6bff; }
      .native__hero { min-height: 564px; display: grid; grid-template-columns: 0.84fr 1.16fr; align-items: center; gap: clamp(36px, 7vw, 112px); padding: 68px clamp(24px, 6vw, 92px); }
      .native__copy h2 { max-width: 590px; margin: 0; font-size: clamp(3.5rem, 6.2vw, 6.25rem); letter-spacing: -0.075em; line-height: 0.88; }
      .native__copy h2 b { color: #0e70fb; font-weight: 720; }
      .native__copy p { max-width: 45ch; margin: 26px 0; color: #60646d; font-size: 17px; line-height: 1.64; }
      .native__button-row { display: flex; gap: 12px; }
      .native__button-row button { min-height: 42px; padding: 0 15px; border: 0; border-radius: 9px; background: #0d6bff; box-shadow: 0 1px 0 rgb(255 255 255 / 32%) inset, 0 4px 11px rgb(13 107 255 / 24%); color: #fff; cursor: pointer; font-size: 13px; font-weight: 720; }
      .native__button-row button:last-child { border: 1px solid rgb(35 38 45 / 14%); background: rgb(255 255 255 / 64%); box-shadow: none; color: #3f424a; }
      .native__visual { position: relative; }
      .native__window { overflow: hidden; border: 1px solid rgb(31 34 41 / 23%); border-radius: 14px; background: #fff; box-shadow: 0 30px 58px rgb(31 37 55 / 20%), 0 2px 0 rgb(255 255 255 / 85%) inset; }
      .native__chrome { height: 38px; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; border-bottom: 1px solid #dadddf; background: linear-gradient(#f6f7f8, #eceef0); }
      .native__dots { display: flex; gap: 7px; }
      .native__dots i { width: 10px; height: 10px; border-radius: 50%; background: #ff5f57; } .native__dots i:nth-child(2) { background: #febc2e; } .native__dots i:nth-child(3) { background: #28c840; }
      .native__chrome span { color: #4e5158; font-size: 11px; font-weight: 700; }
      .native__window img { width: 100%; }
      .native__sync { position: absolute; right: -22px; bottom: 30px; display: flex; align-items: center; gap: 9px; padding: 10px 13px; border: 1px solid rgb(47 53 64 / 13%); border-radius: 11px; background: rgb(255 255 255 / 82%); box-shadow: 0 12px 26px rgb(31 37 55 / 13%); color: #45484f; font-size: 12px; font-weight: 700; backdrop-filter: blur(16px); }
      .native__sync i { width: 8px; height: 8px; border-radius: 50%; background: #24c36b; box-shadow: 0 0 0 4px rgb(36 195 107 / 16%); }
      .native__tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 0 clamp(24px, 6vw, 92px) 52px; }
      .native__tile { min-height: 122px; padding: 18px; border: 1px solid rgb(42 46 54 / 13%); border-radius: 13px; background: rgb(255 255 255 / 62%); box-shadow: 0 1px 0 rgb(255 255 255 / 75%) inset; }
      .native__tile span { display: block; color: #777b84; font-size: 12px; }
      .native__tile b { display: block; margin-top: 24px; font-size: 16px; letter-spacing: -0.025em; }
      .workflow-popover { position: fixed; z-index: 20; right: 24px; bottom: 24px; width: min(430px, calc(100% - 32px)); padding: 22px; border: 1px solid rgb(255 255 255 / 18%); border-radius: 16px; background: #171927; box-shadow: 0 20px 80px rgb(0 0 0 / 34%); color: #fff; }
      .workflow-popover p { margin: 6px 0 18px; color: #cacade; font-size: 14px; line-height: 1.55; }
      .workflow-popover button { min-height: 36px; padding: 0 12px; border: 0; border-radius: 8px; background: #a19cff; color: #171727; cursor: pointer; font-size: 12px; font-weight: 800; }
      @keyframes appear { from { opacity: 0; transform: translateY(12px); } }
      @media (max-width: 860px) { .design-brief { grid-template-columns: 1fr; gap: 20px; } .concept { min-height: auto; } .minimal__hero, .future__hero, .native__hero { grid-template-columns: 1fr; min-height: auto; padding-block: 52px; } .future__visual { min-height: 370px; } .minimal__visual { max-width: 700px; } .minimal__proof { grid-template-columns: 1fr; } .minimal__proof div { min-height: auto; border-right: 0; border-bottom: 1px solid #deddd8; } .minimal__proof div:last-child { border-bottom: 0; } .future__lower { grid-template-columns: 1fr; } .future__chips { justify-content: flex-start; } .native__tiles { grid-template-columns: 1fr; } }
      @media (max-width: 580px) { .studio-bar { align-items: flex-start; flex-direction: column; gap: 12px; } .direction-switcher { width: 100%; } .concept-nav { height: auto; flex-wrap: wrap; padding-block: 16px; } .concept-links { order: 3; width: 100%; overflow-x: auto; } .concept-links span { flex: none; } .minimal__copy h2, .future__copy h2, .native__copy h2 { font-size: clamp(3rem, 15vw, 4.4rem); } .minimal__action-row, .future__buttons, .native__button-row { flex-direction: column; align-items: stretch; } .minimal__action-row span { text-align: center; } .future__visual { min-height: 280px; } .future__window { top: 25px; } .native__sync { right: 4px; bottom: -15px; } .preview-footer { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <header class="studio-bar">
      <div class="studio-title"><strong>FileNest · Main Site Redesign</strong><span>Three directions using the same local-AI product story</span></div>
      <nav class="direction-switcher" aria-label="Choose a design direction">
        <button type="button" data-direction="minimal">01 · Editorial minimal</button>
        <button type="button" data-direction="future">02 · Future AI</button>
        <button type="button" data-direction="native">03 · macOS native</button>
      </nav>
    </header>
    <main id="root"></main>
    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
    <script type="text/babel" src="app.jsx"></script>
  </body>
</html>
